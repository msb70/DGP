<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DGP Conductor">
<title>DGP Conductor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#F3F6F4;--surface:#fff;--line:#E2E8E4;--ink:#0F172A;--muted:#64748B;--brand:#16A34A;--brand-dark:#15803D;--brand-soft:#DCFCE7;--warn:#D97706;--warn-soft:#FEF3C7;--crit:#DC2626;--crit-soft:#FEE2E2;--info:#2563EB;--info-soft:#DBEAFE;--sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.bar{background:#0B1220;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.bar b{font-size:16px;display:block}.bar small{font-size:12px;color:#94A3B8}
.st{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.12);display:inline-flex;align-items:center;gap:6px}.st i{width:8px;height:8px;border-radius:50%;background:#4ADE80;display:inline-block}.st.off i{background:#F59E0B}
main{flex:1;padding:12px 12px calc(90px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card.cur{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.card.done{opacity:.6}
h1{font-size:18px;margin:0 0 8px}h2{font-size:15px;margin:0}
.t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.eta{font-family:var(--mono);font-size:14px;font-weight:600}
.mini{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.p-ok{background:var(--brand-soft);color:#15803D}.p-warn{background:var(--warn-soft);color:#B45309}.p-crit{background:var(--crit-soft);color:#B91C1C}.p-info{background:var(--info-soft);color:#1D4ED8}.p-mut{background:#F1F5F9;color:#475569}
.big{all:unset;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:14px;border-radius:12px;font-weight:700;background:var(--brand);color:#fff;margin-top:8px;font-size:16px;box-shadow:0 8px 18px -10px rgba(22,163,74,.9)}
.big.sec{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.big.warn{background:var(--warn);box-shadow:none}.big.crit{background:var(--crit);box-shadow:none}.big.info{background:var(--info);box-shadow:none}
.big:disabled{opacity:.4}.big:active{transform:translateY(1px)}.big svg{width:20px;height:20px}
.row{display:flex;gap:8px}.row .big{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-top:8px}.kv b{color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);margin-top:6px}
label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-top:10px}
canvas.sig{width:100%;height:140px;border:1px dashed #94A3B8;border-radius:10px;background:#fff;touch-action:none;display:block;margin-top:6px}
.foto{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:6px;display:none}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:10}
.bottom .big{margin:0;padding:11px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0F172A;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
.toast.on{opacity:1}
.prog{height:6px;background:#E2E8E4;border-radius:3px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--brand)}
.q{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}.q:last-child{border:none}.q input{width:64px;margin:0;padding:6px;text-align:center;font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;cursor:pointer}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.login{padding:24px 12px}.login .logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#22C55E,#15803D);display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--mono);font-size:20px;margin:20px auto}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;cursor:pointer}.opt b{display:block}.opt .av{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:#15803D;display:grid;place-items:center;font-weight:800}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="bar"><div><b id="hd-title">DGP Conductor</b><small id="hd-sub">Cargando…</small></div><span class="st" id="hd-st"><i></i>En línea</span></div>
<main id="main"></main>
<div class="bottom hidden" id="bottom"></div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/seed.js"></script>
<script src="js/db.js"></script>
<script src="js/geo.js"></script>
<script src="js/conductor.js"></script>
</body>
</html>
